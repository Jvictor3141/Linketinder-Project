<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkeTinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>

<body>
  <div class="stage" data-screen="select">
    <header class="masthead">
      <span class="wordmark">Linketinder</span>
      <p class="tagline">
        Duas pontas de uma vaga. Nenhum nome ou rosto até o match.
      </p>
    </header>

    <section class="screen screen--select" aria-hidden="false">
      <button class="role-card role-card--candidato" data-role="candidato" type="button">
        <span class="role-card__body">
          <span class="role-card__label">Sou candidato</span>
          <span class="role-card__hint">Quero buscar vagas por perfil, sem currículo
            exposto</span>
        </span>
      </button>

      <button class="role-card role-card--empresa" data-role="empresa" type="button">
        <span class="role-card__body">
          <span class="role-card__label">Sou empresa</span>
          <span class="role-card__hint">Quero buscar talentos por perfil, sem preconceito
            de nome</span>
        </span>
      </button>
    </section>

    <section class="screen screen--login" aria-hidden="true" data-role="">
      <button class="back-link" type="button">
        escolher outro perfil
      </button>

      <h1 class="login-title">
        Entrar como <span class="login-role"></span>
      </h1>

      <form class="login-form aba ativa">
        <label>
          <span>E-mail</span>
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>
          <span>Senha</span>
          <input type="password" name="senha" autocomplete="current-password" required />
        </label>
        <button type="submit" class="submit-btn">Entrar</button>
        <p class="signup-hint">
          Ainda não tem conta? <a id="cad-link" href="#">Criar conta</a>
        </p>
      </form>


      <form id="aba-cad-candidato" class="cad-form aba">
        <input name="nome" placeholder="Nome" required />
        <input name="email" type="email" placeholder="E-mail" required />
        <input name="senha" type="password" minlength="6" placeholder="Senha (mín. 6)" required />
        <input name="cpf" placeholder="CPF" required />
        <input name="idade" type="number" min="16" placeholder="Idade" required />
        <input name="estado" placeholder="Estado" required />
        <input name="cep" placeholder="CEP" required />
        <input name="formacao" placeholder="Formação" required />
        <input name="competencias" placeholder="Competências separadas por vírgula (ex: Python, Java)" required />
        <textarea name="descricao" placeholder="Descrição pessoal" required></textarea>
        <button type="submit" class="submit-btn">Criar conta</button>
      </form>

      <form id="aba-cad-empresa" class="cad-form aba">
        <input name="nome" placeholder="Nome da empresa" required />
        <input name="email" type="email" placeholder="E-mail corporativo" required />
        <input name="senha" type="password" minlength="6" placeholder="Senha (mín. 6)" required />
        <input name="cnpj" placeholder="CNPJ" required />
        <input name="pais" placeholder="País" required />
        <input name="estado" placeholder="Estado" required />
        <input name="cep" placeholder="CEP" required />
        <textarea name="descricao" placeholder="Descrição da empresa" required></textarea>
        <button type="submit" class="submit-btn">Criar conta</button>
      </form>
    </section>
  </div>
  <div class="user-logado">
    <header>
      <h1>Bem vindo, <span id="user_name"></span></h1>
      <div class="header-actions">
        <button id="profile-button" type="button">Perfil</button>
        <button id="logout-button" type="button">Sair</button>
      </div>
    </header>

    <main class="logged-content">
      <section class="feed-section" aria-label="Perfis para descobrir">
        <p class="empty">Carregando perfis...</p>
      </section>

      <section class="profile-screen" id="profile-screen" hidden>
        <div class="profile-heading">
          <h2>Meu perfil</h2>
          <button class="back-link" id="feed-button" type="button">Voltar ao feed</button>
        </div>

        <form id="candidate-profile-form" class="cad-form profile-form" hidden>
          <label><span>Nome</span><input name="nome" required /></label>
          <label><span>E-mail</span><input name="email" type="email" required /></label>
          <label><span>Nova senha</span><input name="senha" type="password" minlength="6" placeholder="Deixe vazio para manter a atual" /></label>
          <label><span>CPF</span><input name="cpf" required /></label>
          <label><span>Idade</span><input name="idade" type="number" min="16" required /></label>
          <label><span>Estado</span><input name="estado" required /></label>
          <label><span>CEP</span><input name="cep" required /></label>
          <label><span>Formação</span><input name="formacao" required /></label>
          <label><span>Competências (separadas por vírgula)</span><input name="competencias" required /></label>
          <label><span>Descrição</span><textarea name="descricao" required></textarea></label>
          <button class="submit-btn" type="submit">Salvar alterações</button>
        </form>

        <form id="company-profile-form" class="cad-form profile-form" hidden>
          <label><span>Nome da empresa</span><input name="nome" required /></label>
          <label><span>E-mail corporativo</span><input name="email" type="email" required /></label>
          <label><span>Nova senha</span><input name="senha" type="password" minlength="6" placeholder="Deixe vazio para manter a atual" /></label>
          <label><span>CNPJ</span><input name="cnpj" required /></label>
          <label><span>País</span><input name="pais" required /></label>
          <label><span>Estado</span><input name="estado" required /></label>
          <label><span>CEP</span><input name="cep" required /></label>
          <label><span>Descrição</span><textarea name="descricao" required></textarea></label>
          <button class="submit-btn" type="submit">Salvar alterações</button>
        </form>

        <section id="company-vacancy-management" class="vacancy-management" hidden>
          <h3>Gerenciar vagas</h3>
          <form id="vacancy-form" class="cad-form">
            <label><span>Título da vaga</span><input name="titulo" required /></label>
            <label><span>Descrição</span><textarea name="descricao" required></textarea></label>
            <label><span>Competências (separadas por vírgula)</span><input name="competencias" required /></label>
            <button class="submit-btn" type="submit">Criar vaga</button>
          </form>
          <div id="company-vacancies" class="company-vacancies"></div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>

</html>
